<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap">
<style>
:root { --lime: #9ec24f; --ink: #f2f4ef; --muted: #a7ae9f; }
html, body { margin: 0; background: #050605; }
.card { position: relative; width: 1280px; height: 640px; overflow: hidden; font-family: Inter, Arial, sans-serif; color: var(--ink);
  background:
    radial-gradient(ellipse 55% 60% at 78% 62%, rgba(158,194,79,.30), transparent 70%),
    radial-gradient(ellipse 40% 30% at 70% 100%, rgba(120,190,40,.35), transparent 70%),
    linear-gradient(180deg, #0b0d0a, #030403); }
.card.wide { width: 1600px; height: 600px; }
.grain { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }
.copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.eyebrow { font-size: 14px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--lime); }
h1 { margin: 0; font-size: 88px; line-height: .92; font-weight: 900; letter-spacing: -.045em; }
h1 span { display: block; color: var(--lime); }
.sub { font-size: 21px; line-height: 1.45; color: #d4d9cf; max-width: 420px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 4px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); color: #e7ebe2; }
.chip b { color: var(--lime); font-weight: 700; }
.stage { position: absolute; right: 56px; top: 50%; width: 680px; height: 383px; transform: translateY(-50%); perspective: 2000px; }
.shot { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; background-size: cover;
  box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 30px 80px rgba(0,0,0,.7); }
.s1 { transform: rotateY(-9deg); z-index: 3; }
.s2 { transform: translate(44px, -44px) rotateY(-9deg) scale(.94); z-index: 2; filter: brightness(.5); }
.s3 { display: none; }
.wide .copy { left: 96px; width: 560px; }
.wide .stage { right: 80px; width: 800px; height: 450px; }
.foot { position: absolute; left: 72px; bottom: 30px; font-size: 13px; color: #6f7769; letter-spacing: .02em; }
.wide .foot { left: 96px; }
</style></head><body>
<div class="card" id="card">
  <div class="grain"></div>
  <div class="copy">
    <div class="eyebrow">Skin para Aurora · Xbox 360</div>
    <h1>Xbox<span>Series</span></h1>
    <div class="sub">A Home da nova geração no seu Xbox 360: arte do jogo em tela cheia, capas com foco verde, relógio e em três idiomas.</div>
    <div class="chips"><span class="chip"><b>pt-BR</b> · EN · ES</span><span class="chip">Relógio <b>24 h</b></span><span class="chip">Aurora <b>0.7b</b></span><span class="chip">Versão <b>2.0</b></span></div>
  </div>
  <div class="stage">
    <div class="shot s3" style="background-image:url(shots/settings-3.png)"></div>
    <div class="shot s2" style="background-image:url(shots/details-0.png)"></div>
    <div class="shot s1" style="background-image:url(shots/home-3.png)"></div>
  </div>
  <div class="foot">Criada por Dimas Silva com Claude Code · Projeto de fã, sem afiliação com a Microsoft.</div>
</div>
<script>if (location.hash === '#wide') document.getElementById('card').classList.add('wide');</script>
</body></html>
